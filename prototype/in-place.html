<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shiny Screenshot: In place, full flow</title>
<!-- PROTOTYPE, throwaway. The chosen "In place" direction, walked through its whole flow.
     Switch steps with the stepper, ?step=1..8, or the ← → keys. Everything is in-memory. -->
<style>
:root{--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
body{margin:0;font-family:var(--font-sans,var(--ui));color:var(--foreground,#1d1d1f)}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:2px 0 8px}
.tabs{display:flex;align-items:stretch;gap:6px}
.arr{flex:none;width:34px;border:1px solid var(--border,#e2e2e6);border-radius:var(--radius,8px);background:none;color:inherit;cursor:pointer;display:grid;place-items:center}
.tablist{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;border-radius:calc(var(--radius,8px) + 3px);background:var(--muted,#f1f1f4)}
.tab{border:0;background:none;color:var(--muted-foreground,#6e6e78);font:inherit;text-align:left;padding:7px 10px;border-radius:var(--radius,8px);cursor:pointer;display:flex;flex-direction:column;gap:1px}
.tab b{font-size:13.5px;color:var(--foreground,#1d1d1f)}
.tab span{font-size:11.5px;line-height:1.3}
.tab[aria-selected=true]{background:var(--background,#fff);box-shadow:0 1px 3px rgb(0 0 0/.14)}
.tab:focus-visible,.arr:focus-visible{outline:2px solid var(--ring,#2f6bff);outline-offset:1px}
.hint{margin:0;font-size:12.5px;color:var(--muted-foreground,#6e6e78)}
.viewport{position:relative;height:calc(720px*var(--k,.65))}
.notes{display:grid;grid-template-columns:1fr 1.3fr;gap:28px;padding:4px 2px}
.notes[hidden],.mock[hidden]{display:none}
.notes p{margin:0 0 10px;font-size:15px;line-height:1.5}
.notes .for{font-size:13px;color:var(--muted-foreground,#6e6e78)}
.notes ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
.notes li{margin-bottom:5px}
@media (max-width:560px){.notes{grid-template-columns:1fr;gap:8px}.tab span{display:none}}

/* ---------- shared mock pieces ---------- */
.mock{position:absolute;left:0;top:0;width:1120px;height:720px;transform:scale(var(--k,.65));transform-origin:0 0;border-radius:12px;overflow:hidden;font:13px/1.4 var(--ui);color:#1d1d1f;box-shadow:0 0 0 1px rgb(0 0 0/.1),0 24px 60px -24px rgb(0 0 0/.45);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
:where(.mock) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(.mock) kbd{font:inherit}
.i{display:block;flex:none}
.toast{position:absolute;left:50%;bottom:28px;z-index:60;transform:translate(-50%,16px);opacity:0;transition:.25s;background:#1d1d1f;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgb(0 0 0/.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.seg{display:inline-flex;gap:1px;padding:2px;border-radius:8px;background:rgb(0 0 0/.06)}
.seg button{padding:4px 9px;border-radius:6px;font-size:12px;color:#55555f;white-space:nowrap}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgb(0 0 0/.14)}
.sw{position:relative;width:30px;height:18px;border-radius:9px;background:#d4d4d8;transition:background .2s}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.3);transition:transform .2s}
.sw.on{background:var(--acc-ui,#2f6bff)}.sw.on::after{transform:translateX(12px)}
.rg,.a-check{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:#55555f}
.rg span{width:72px}.rg input{flex:1;min-width:0;accent-color:var(--acc-ui,#2f6bff)}
.rg output{width:36px;text-align:right;font-variant-numeric:tabular-nums;color:#1d1d1f}
.a-row{margin-top:12px;font-size:12px;color:#55555f}.a-row>span{display:block;margin-bottom:6px}
.a-row .seg{display:flex}.a-row .seg button{flex:1;padding:4px 0}

/* the "screenshot" being edited: a 640x400 app */
.fit{position:relative;overflow:hidden}
.cv{position:absolute;left:50%;top:50%;display:grid;place-items:center;transform-origin:50% 50%}
.cv.grain::after{content:'';position:absolute;inset:0;background:var(--noise);opacity:.35;mix-blend-mode:overlay;pointer-events:none}
.frame{position:relative;overflow:hidden;background:#fff;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.frame.f-none{background:transparent}
.frame.f-glass{padding:7px;background:rgb(255 255 255/.22);border:1px solid rgb(255 255 255/.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.fbar{display:none}
.f-mac>.fbar,.f-browser>.fbar,.fbar.mac{display:flex;align-items:center;gap:6px;box-sizing:border-box;height:29px;padding:0 11px;position:relative;background:#f6f6f8;border-bottom:1px solid #e6e6ea}
.f-browser>.fbar{height:35px}
.fbar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.fbar i:nth-child(2){background:#febc2e}.fbar i:nth-child(3){background:#28c840}
.fbar span{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:500;color:#6e6e78;white-space:nowrap}
.fbar .url{display:flex;align-items:center;gap:5px;padding:4px 48px;border-radius:7px;background:#ebebef;color:#55555f}
.shot{position:relative;overflow:hidden;background:#fff}
.inner{position:absolute;left:0;top:0;width:640px;height:400px;touch-action:none}
.ap{position:relative;width:640px;height:400px;overflow:hidden;background:#fff;color:#18181b;font:11px/1.35 var(--ui);text-align:left}
.ap-top{height:40px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #eef0f3}
.ap-logo{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#10b981,#0ea5e9)}
.ap-top b{font-size:12.5px}
.ap-nav{display:flex;gap:2px;margin-left:14px}.ap-nav span{padding:5px 9px;border-radius:6px;color:#71717a}.ap-nav .on{background:#f4f4f5;color:#18181b;font-weight:600}
.ap-search{margin-left:auto;width:130px;padding:4px 9px;border:1px solid #e4e4e7;border-radius:7px;color:#a1a1aa}
.ap-av{width:24px;height:24px;border-radius:50%;background:#fde68a;color:#92400e;font-size:9px;font-weight:700;display:grid;place-items:center}
.ap-body{padding:14px 18px 0}
.ap-kpi{display:flex;justify-content:space-between;align-items:flex-start;height:54px}
.ap-l{color:#71717a}
.ap-v{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:26px;line-height:34px;font-weight:700;letter-spacing:-.02em}
.ap-up{font-size:11px;line-height:1;font-weight:600;letter-spacing:0;color:#047857;background:#d1fae5;padding:4px 7px;border-radius:999px}
.ap-seg{display:flex;padding:2px;border-radius:7px;background:#f4f4f5}.ap-seg span{padding:4px 9px;border-radius:5px;color:#71717a}.ap-seg .on{background:#fff;color:#18181b;font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.12)}
.ap-chart{display:block;width:604px;height:104px;margin:6px 0 10px;overflow:visible}
.ap-h{height:22px;font-size:12px;font-weight:600}
.ap-tr{display:grid;grid-template-columns:1.1fr 1.5fr .7fr .8fr;align-items:center;height:29px;border-top:1px solid #f1f1f4}
.ap-th{height:24px;border-top:0;color:#a1a1aa;font-size:10px}
.ap-tr>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ap-pill{justify-self:start;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600}.ap-pill.ok{background:#dcfce7;color:#15803d}.ap-pill.due{background:#fef3c7;color:#b45309}

/* annotations */
.ann{position:absolute;left:0;top:0;width:640px;height:400px;overflow:visible;pointer-events:none}
.ann>*{filter:drop-shadow(0 1px 1.5px rgb(0 0 0/.35))}
.a-arrow{stroke-width:1.5;stroke-linejoin:round}
.a-rect{fill:none;stroke-width:3.5}
.a-hl{fill:#ffd60a;opacity:.5;mix-blend-mode:multiply;filter:none!important}
.a-pen{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.annh{position:absolute;inset:0;pointer-events:none}.annh>*{position:absolute}
.a-blur{border-radius:4px;background:rgb(235 235 240/.35);backdrop-filter:blur(5px) saturate(.5);-webkit-backdrop-filter:blur(5px) saturate(.5)}
.a-step{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;color:#fff;font:700 12px/24px var(--ui);text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgb(0 0 0/.35)}
.a-text{transform:translateY(-50%);padding:4px 9px;border-radius:7px;font:600 12.5px/1.25 var(--ui);white-space:nowrap;box-shadow:0 2px 8px rgb(0 0 0/.25);pointer-events:auto;outline:none;user-select:text;-webkit-user-select:text}
.a-text[contenteditable]{cursor:text}.a-text[contenteditable]:focus{box-shadow:0 0 0 2px #fff,0 0 0 4px #0a84ff}

/* crop */
.cropui{position:absolute;inset:0;pointer-events:none}
.crop{position:absolute;pointer-events:auto;cursor:move;outline:1.5px solid rgb(255 255 255/.95);box-shadow:0 0 0 3000px rgb(0 0 0/.5)}
.crop::before,.crop::after{content:'';position:absolute;border:0 solid rgb(255 255 255/.45);pointer-events:none}
.crop::before{inset:0 33.33%;border-width:0 1px}.crop::after{inset:33.33% 0;border-width:1px 0}
.crop em{position:absolute;left:8px;top:8px;font:500 10px/1 var(--mono);font-style:normal;background:rgb(0 0 0/.7);color:#fff;padding:4px 6px;border-radius:5px;pointer-events:none}
.h{position:absolute;z-index:1;width:16px;height:16px;margin:-8px 0 0 -8px;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgb(0 0 0/.45)}
.h-nw{left:0;top:0;cursor:nwse-resize}.h-ne{left:100%;top:0;cursor:nesw-resize}.h-se{left:100%;top:100%;cursor:nwse-resize}.h-sw{left:0;top:100%;cursor:nesw-resize}
.h-n,.h-s{left:50%;width:26px;height:7px;margin:-3.5px 0 0 -13px;cursor:ns-resize}.h-n{top:0}.h-s{top:100%}
.h-e,.h-w{top:50%;width:7px;height:26px;margin:-13px 0 0 -3.5px;cursor:ew-resize}.h-e{left:100%}.h-w{left:0}
/* ---------- B: In-place ---------- */
.vB{background:#000}
.b-desk{position:absolute;inset:0}
.b-menu{height:26px;display:flex;align-items:center;gap:18px;padding:0 16px;background:rgb(255 255 255/.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:12.5px}
.b-mr{margin-left:auto;display:flex;align-items:center;gap:12px}
.ss{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#16a34a;color:#fff;font:700 8px/1 var(--ui)}
.b-win{position:absolute;border-radius:11px;overflow:hidden;background:#fff;box-shadow:0 0 0 .5px rgb(0 0 0/.3),0 30px 70px -10px rgb(0 0 0/.55)}
.b-notes{left:48px;top:76px;width:300px;height:330px;background:#fffdf4}
.b-notes .fbar{background:#f7f3e3;border-color:#ece5c8}
.b-notes-b{padding:16px 18px;font-size:13px;line-height:1.7;color:#3f3a2e}.b-notes-b h5{margin:0 0 8px;font-size:16px}
.b-app{left:400px;top:96px}
.b-dock{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:8px;padding:7px;border-radius:18px;background:rgb(255 255 255/.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgb(255 255 255/.3)}
.b-dock>*{width:44px;height:44px;border-radius:11px;background:var(--g)}
.b-dock .ss{font-size:17px;border-radius:11px}
.b-over{position:absolute;inset:0;z-index:5;cursor:crosshair;touch-action:none}
.b-sel{position:absolute;cursor:move;outline:1.5px solid #ffd60a;box-shadow:0 0 0 4000px rgb(8 8 16/.5)}
.b-sel.drawing{cursor:crosshair}
.b-sel .h{background:#ffd60a}
.b-tag{position:absolute;left:-1px;bottom:calc(100% + 8px);padding:3px 7px;border-radius:5px;background:#ffd60a;color:#111;font:600 11px/1.2 var(--mono);white-space:nowrap}
.b-loupe{position:absolute;display:none;pointer-events:none;z-index:30}.b-loupe.on{display:block}
.b-lens{position:relative;width:120px;height:120px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 8px 24px rgb(0 0 0/.5)}
.b-lens::before,.b-lens::after{content:'';position:absolute;background:rgb(255 59 48/.85);z-index:1}
.b-lens::before{left:59px;top:0;width:2px;height:100%}.b-lens::after{top:59px;left:0;height:2px;width:100%}
.b-lz{position:absolute;left:0;top:0;transform-origin:0 0}
.b-coord{display:block;margin-top:6px;text-align:center;font:600 11px var(--mono);color:#fff;text-shadow:0 1px 3px #000}
.b-hud{position:absolute;top:38px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;padding:5px;border-radius:14px;background:rgb(28 28 32/.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgb(255 255 255/.18),0 12px 30px rgb(0 0 0/.4);color:#fff}
.b-hud button{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;font-size:12.5px;color:rgb(255 255 255/.78)}
.b-hud button.on{background:rgb(255 255 255/.16);color:#fff}
.b-hud hr{width:1px;height:18px;border:0;background:rgb(255 255 255/.18);margin:0 3px}
.b-bar{position:absolute;z-index:20;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;background:rgb(28 28 32/.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgb(255 255 255/.18),0 12px 30px rgb(0 0 0/.45);color:#fff;white-space:nowrap}
.b-bar [data-tool]{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:rgb(255 255 255/.85)}
.b-bar [data-tool].on{background:#ffd60a;color:#111}
.b-c{width:16px;height:16px;margin:0 3px;border-radius:50%;background:var(--c)}.b-c.on{box-shadow:0 0 0 2px #1c1c20,0 0 0 3.5px #fff}
.b-bar hr{width:1px;height:20px;border:0;background:rgb(255 255 255/.16);margin:0 5px}
.b-act{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:12.5px}.b-act:hover{background:rgb(255 255 255/.1)}
.b-done{background:#ffd60a;color:#111!important;font-weight:600}
.b-card{position:absolute;left:20px;bottom:20px;z-index:20;width:300px;box-sizing:border-box;padding:12px;border-radius:16px;background:rgb(30 30 34/.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;box-shadow:0 20px 50px rgb(0 0 0/.5),inset 0 0 0 .5px rgb(255 255 255/.16)}
.b-card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-size:12.5px}.b-card-h span{font:11px var(--mono);color:rgb(255 255 255/.55)}
.b-card .fit{height:166px;border-radius:10px;background:rgb(0 0 0/.3)}
.b-sws{display:flex;gap:6px;margin:10px 0}.b-sws button{flex:1;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgb(255 255 255/.15)}.b-sws button.on{box-shadow:0 0 0 2px #1e1e22,0 0 0 3.5px #fff}
.b-card-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.b-card-acts button{height:30px;border-radius:8px;background:rgb(255 255 255/.1);font-size:12px}
.b-keys{position:absolute;right:20px;bottom:24px;z-index:20;display:flex;gap:14px;color:rgb(255 255 255/.8);font-size:11.5px}
.b-keys kbd{display:inline-block;min-width:14px;margin-right:5px;padding:1px 5px;border-radius:4px;background:rgb(255 255 255/.18);text-align:center}
/* ---------- In place flow ---------- */
.steps{display:flex;align-items:stretch;gap:6px}
.steplist{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:0;padding:3px;list-style:none;border-radius:calc(var(--radius,8px) + 3px);background:var(--muted,#f1f1f4)}
.steplist button{width:100%;height:100%;border:0;background:none;font:inherit;font-size:12px;color:var(--muted-foreground,#6e6e78);padding:6px 2px;border-radius:var(--radius,8px);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.steplist i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--foreground,#1d1d1f);box-shadow:inset 0 0 0 1px var(--border,#d8d8de)}
.steplist button[aria-current=step]{background:var(--background,#fff);color:var(--foreground,#1d1d1f);box-shadow:0 1px 3px rgb(0 0 0/.14)}
.steplist button[aria-current=step] i{background:var(--foreground,#1d1d1f);color:var(--background,#fff);box-shadow:none}
.steplist button:focus-visible{outline:2px solid var(--ring,#2f6bff);outline-offset:1px}
.notes .nt{font-weight:600;margin-bottom:4px}
@media (max-width:560px){.steplist{grid-template-columns:repeat(4,1fr)}}

.ip [hidden]{display:none!important}
.ip .b-bar{transform:none}
.ip .b-loupe{display:block}
.ip:not(.s-2):not(.s-3) .b-host :is(.ann,.annh){display:none}
.s-4 .b-sel{outline:0}.s-4 .b-sel>*,.s-7 .b-sel>*{display:none}
.s-7 .b-sel{outline:2px dashed #ff3b30;cursor:default}.s-7 .b-over,.s-4 .b-over{cursor:default}
.b-menu .ss{cursor:pointer}.s-1 .b-menu .ss{box-shadow:0 0 0 3px rgb(255 255 255/.45)}
.ip-bfy{position:absolute}
.ip .toast{bottom:96px}
.ip-bgbtn.on{background:rgb(255 255 255/.16)}
.ip-chipwrap{display:flex}.ip-chipwrap:empty{display:none}
.ip-chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;margin-right:4px;border-radius:8px;background:#fef3c7;color:#92400e!important;font-size:12.5px;font-weight:600}

.ip-panel{position:absolute;right:16px;top:96px;z-index:20;width:240px;box-sizing:border-box;padding:14px;border-radius:16px;background:rgb(28 28 32/.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;box-shadow:inset 0 0 0 .5px rgb(255 255 255/.18),0 16px 40px rgb(0 0 0/.45);--acc-ui:#ffd60a}
.ip-ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
.ip-ph button{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:7px;font-size:12px;color:rgb(255 255 255/.8);background:rgb(255 255 255/.08)}
.ip-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ip-tiles button{aspect-ratio:1.35;border-radius:7px;box-shadow:inset 0 0 0 1px rgb(255 255 255/.14)}
.ip-tiles button.on{box-shadow:0 0 0 2px #1c1c20,0 0 0 3.5px #ffd60a}
.ip-panel .rg,.ip-panel .a-row{color:rgb(255 255 255/.62)}.ip-panel .rg output{color:#fff}
.ip-panel .seg,.ip-rec .seg{background:rgb(255 255 255/.08)}
.ip-panel .seg button,.ip-rec .seg button{color:rgb(255 255 255/.7);font-size:11.5px}
.ip-panel .seg button.on,.ip-rec .seg button.on{background:rgb(255 255 255/.18);color:#fff;box-shadow:none}

.ip-menu{position:absolute;right:118px;top:30px;z-index:20;width:290px;box-sizing:border-box;padding:6px;border-radius:12px;background:rgb(40 40 46/.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#fff;font-size:13px;box-shadow:inset 0 0 0 .5px rgb(255 255 255/.2),0 18px 40px rgb(0 0 0/.45)}
.ip-menu button{width:100%;display:flex;align-items:center;gap:10px;height:28px;padding:0 10px;border-radius:6px;text-align:left}
.ip-menu button:hover,.ip-menu button.hot{background:#0a84ff}
.ip-menu kbd{margin-left:auto;color:rgb(255 255 255/.55);font-size:12px}
.ip-menu hr{border:0;border-top:1px solid rgb(255 255 255/.12);margin:6px 8px}
.ip-menu h6{margin:4px 10px 6px;font-size:11.5px;font-weight:600;color:rgb(255 255 255/.5)}
.ip-recent{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 8px 4px}
.ip-recent .fit{height:56px;border-radius:7px;background:rgb(0 0 0/.25)}

.ip-stack{position:absolute;left:20px;bottom:20px;z-index:20;width:300px}

function arrowD({x1,y1,x2,y2}){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux,hl=Math.min(20,L*.5),nx=x2-ux*hl,ny=y2-uy*hl,q=(x,y,k)=>`${(x+px*k).toFixed(1)},${(y+py*k).toFixed(1)}`;return`M${q(x1,y1,1.2)}L${q(nx,ny,3.2)}L${q(nx,ny,9.5)}L${x2.toFixed(1)},${y2.toFixed(1)}L${q(nx,ny,-9.5)}L${q(nx,ny,-3.2)}L${q(x1,y1,-1.2)}Z`}
const svgAnn=a=>a.t==='arrow'?`<path class="a-arrow" d="${arrowD(a)}" fill="${a.c}" stroke="${a.c}"/>`
 :a.t==='rect'?`<rect class="a-rect" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="6" stroke="${a.c}"/>`
 :a.t==='hl'?`<rect class="a-hl" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="3"/>`
 :a.t==='pen'?`<polyline class="a-pen" points="${a.pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" stroke="${a.c}"/>`:'';
const htmlAnn=(a,i,edit)=>{const pos=`left:${a.x}px;top:${a.y}px`;
 return a.t==='blur'?`<div class="a-blur" style="${pos};width:${a.w}px;height:${a.h}px"></div>`
 :a.t==='step'?`<div class="a-step" style="${pos};background:${a.c}">${a.n}</div>`
 :a.t==='text'?`<div class="a-text" data-i="${i}"${edit?' contenteditable="plaintext-only" spellcheck="false"':''} style="${pos};background:${a.c};color:${a.c==='#ffd60a'?'#1d1d1f':'#fff'}">${esc(a.s)}</div>`:''};
const rectFrom=(p,q)=>({x:Math.min(p.x,q.x),y:Math.min(p.y,q.y),w:Math.abs(q.x-p.x),h:Math.abs(q.y-p.y)});
const tiny=a=>a.t==='arrow'?Math.hypot(a.x2-a.x1,a.y2-a.y1)<8:a.t==='pen'?a.pts.length<3:a.w<6||a.h<6;
function drag(move,up){const u=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',u);up&&up()};addEventListener('pointermove',move);addEventListener('pointerup',u)}
function cropDrag(c,m,dx,dy){let{x,y,w,h}=c;const M=40;
 if(m==='move')return{x:clamp(x+dx,0,W-w),y:clamp(y+dy,0,H-h),w,h};
 if(m.includes('w')){const nx=clamp(x+dx,0,x+w-M);w+=x-nx;x=nx}
 if(m.includes('e'))w=clamp(w+dx,M,W-x);
 if(m.includes('n')){const ny=clamp(y+dy,0,y+h-M);h+=y-ny;y=ny}
 if(m.includes('s'))h=clamp(h+dy,M,H-y);
 return{x,y,w,h}}
const handles=()=>['nw','n','ne','e','se','s','sw','w'].map(h=>`<b class="h h-${h}" data-h="${h}"></b>`).join('');
const cropHTML=c=>`<div class="crop" data-h="move" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px">${handles()}<em>${Math.round(c.w*2)} × ${Math.round(c.h*2)}</em></div>`;

// P maps a pointer event to screenshot coordinates
function startDraw(e,st,P,inner,o={}){
 const s=st.s,p0=P(e),c=s.color,t=s.tool,i=s.anns.length;
 const add=a=>st.set(x=>({anns:[...x.anns,a]}));
 if(t==='step')return add({t,c,x:p0.x,y:p0.y,n:s.anns.filter(a=>a.t==='step').length+1});
 if(t==='text'){
  add({t,c,x:p0.x,y:p0.y,s:o.prompt?(prompt('Label','Look here')||'Look here'):'Type a note'});
  if(!o.prompt)requestAnimationFrame(()=>{const el=$(inner,`.a-text[data-i="${i}"]`);if(el){el.focus();getSelection().selectAllChildren(el)}});
  return}
 let a=t==='arrow'?{t,c,x1:p0.x,y1:p0.y,x2:p0.x,y2:p0.y}:t==='pen'?{t,c,pts:[p0]}:{t,c,x:p0.x,y:p0.y,w:0,h:0};
 add(a);
 drag(ev=>{const p=P(ev);a=t==='arrow'?{...a,x2:p.x,y2:p.y}:t==='pen'?{...a,pts:[...a.pts,p]}:{...a,...rectFrom(p0,p)};st.set(x=>({anns:x.anns.map((b,j)=>j===i?a:b)}))},
  ()=>{if(tiny(a))st.set(x=>({anns:x.anns.filter((_,j)=>j!==i)}))})}

/* ---------- views ---------- */
function mountShot(st,o={}){
 const shot=document.createElement('div');shot.className='shot';
 shot.innerHTML=`<div class="inner">${APP}<svg class="ann" viewBox="0 0 640 400"></svg><div class="annh"></div><div class="cropui"></div></div>`;
 const inner=shot.firstChild,svg=$(inner,'.ann'),annh=$(inner,'.annh'),cropui=$(inner,'.cropui');
 const P=ev=>{const r=inner.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}};
 const render=s=>{const cropping=o.edit&&s.tool==='crop',c=o.full||cropping?FULL:s.crop;
  shot.style.width=c.w+'px';shot.style.height=c.h+'px';inner.style.transform=`translate(${-c.x}px,${-c.y}px)`;
  svg.innerHTML=s.anns.map(svgAnn).join('');annh.innerHTML=s.anns.map((a,i)=>htmlAnn(a,i,o.edit)).join('');
  cropui.innerHTML=cropping?cropHTML(s.crop):''};
 if(o.edit){
  inner.addEventListener('pointerdown',e=>{
   if(e.target.isContentEditable||e.button)return;
   if(document.activeElement?.isContentEditable)document.activeElement.blur();
   const s=st.s;if(!s.tool)return;e.preventDefault();
   if(s.tool!=='crop')return startDraw(e,st,P,inner);
   const p0=P(e),c0=s.crop,m=e.target.dataset.h||'new';
   drag(ev=>{const p=P(ev),c=m==='new'?rectFrom(p0,{x:clamp(p.x,0,W),y:clamp(p.y,0,H)}):cropDrag(c0,m,p.x-p0.x,p.y-p0.y);if(c.w>=24&&c.h>=24)st.set({crop:c})})});
  annh.addEventListener('focusout',e=>{const i=+e.target.dataset.i,txt=e.target.textContent.trim();if(isNaN(i))return;
   st.set(s=>({anns:txt?s.anns.map((a,j)=>j===i?{...a,s:txt}:a):s.anns.filter((_,j)=>j!==i)}))});
  annh.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();e.target.blur()}});
 }
 return{shot,inner,render,P};
}
function mountCanvas(fit,st,o={}){
 const cv=document.createElement('div');cv.className='cv';cv.innerHTML='<div class="frame"><div class="fbar"></div></div>';
 const frame=cv.firstChild,bar=frame.firstChild,sh=mountShot(st,o);frame.append(sh.shot);fit.append(cv);
 const m=o.m??24;
 const draw=s=>{sh.render(s);
  const[w,h]=canvasSize(s,o.edit&&s.tool==='crop'?FULL:s.crop);
  const k=Math.max(.05,Math.min((fit.clientWidth-2*m)/w,(fit.clientHeight-2*m)/h,o.max??1.4));
  cv.style.cssText=`width:${w}px;height:${h}px;background:${BG[s.bg].css};transform:translate(-50%,-50%) scale(${k})`;
  cv.classList.toggle('grain',s.grain);
  frame.className='frame f-'+s.frame;
  frame.style.cssText=`border-radius:${s.radius}px;box-shadow:${SH[s.shadow]};transform:${s.tilt?'perspective(1800px) rotateX(9deg) rotateY(-14deg) rotateZ(1.5deg)':'none'}`;
  sh.shot.style.borderRadius=s.frame==='glass'?Math.max(0,s.radius-6)+'px':'';
  bar.innerHTML=s.frame==='mac'?'<i></i><i></i><i></i><span>Tally — Overview</span>':s.frame==='browser'?`<i></i><i></i><i></i><span class="url">${ic('lock',10)}tally.app/overview</span>`:''};
 const off=st.on(draw),ro=new ResizeObserver(()=>draw(st.s));ro.observe(fit);
 return()=>{off();ro.disconnect()};
}

const OUT={
 pad:s=>s.pad+'px',radius:s=>s.radius+'px',
 size:s=>{const[w,h]=canvasSize(s);return`${Math.round(w*s.scale)} × ${Math.round(h*s.scale)}`},
 sel:s=>`${Math.round(s.crop.w*2)} × ${Math.round(s.crop.h*2)}`,
 redact:s=>{const n=exposed(s).length;return n?`<div class="d-redact">${ic('shield',15)}<span><b>${n} email address${n>1?'es':''}</b> visible</span><button data-act="redact">Blur all</button></div>`:`<div class="d-redact ok">${ic('check',15)}<span>No personal data visible</span></div>`},
 ocr:s=>OCR.filter(([y])=>y>s.crop.y&&y<s.crop.y+s.crop.h).map(l=>esc(l[1])).join('<br>')||'No text found',
};
function toast(el,msg){const t=$(el.closest('.mock'),'.toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}
const undo=st=>st.set(s=>({anns:s.anns.slice(0,-1)}));
const ACT={
 undo,clear:st=>st.set({anns:[]}),
 copy:(st,r)=>toast(r,`Copied ${OUT.size(st.s)} ${st.s.fmt} to the clipboard`),
 save:(st,r)=>toast(r,`Saved “Tally overview.${st.s.fmt.toLowerCase()}” to Desktop`),
 share:(st,r)=>toast(r,'Link copied: shot.link/k9x2a'),
 shuffle:st=>{const ids=Object.keys(BG).filter(i=>i!==st.s.bg&&i!=='clear');st.set({bg:ids[Math.random()*ids.length|0]})},
 auto:(st,r)=>{const m=['lagoon','aurora','matcha'];st.set({bg:m[(m.indexOf(st.s.bg)+1)%3]});toast(r,'Matched to the greens and blues in your screenshot')},
 redact:(st,r)=>{const ex=exposed(st.s);st.set(s=>({anns:[...s.anns,...ex.map(blurFor)]}));toast(r,`Blurred ${ex.length} email address${ex.length>1?'es':''}`)},
 pin:(st,r)=>toast(r,'Pinned. It floats above every window until you close it'),
 ocr:(st,r)=>toast(r,`Copied ${OUT.ocr(st.s).split('<br>').length} lines of text`),
 edit:(st,r)=>toast(r,'Opens in the editor with every layer still editable'),
};
function wire(root,st,acts={}){
 root.addEventListener('click',e=>{
  const t=e.target.closest('[data-tool],[data-bg],[data-color],[data-set],[data-act]');if(!t||!root.contains(t))return;const d=t.dataset;
  if(d.tool)st.set(s=>{const tool=s.tool===d.tool?null:d.tool;return{tool,tilt:tool?false:s.tilt}});
  else if(d.bg)st.set({bg:d.bg});
  else if(d.color)st.set({color:d.color});
  else if(d.set){const i=d.set.indexOf(':'),k=d.set.slice(0,i),v=d.set.slice(i+1);
   st.set(s=>v==='toggle'?{[k]:!s[k],...(k==='tilt'&&!s[k]?{tool:null}:{})}:{[k]:isNaN(v)?v:+v})}
  else(acts[d.act]||ACT[d.act])?.(st,root,t)});
 root.addEventListener('input',e=>{const k=e.target.dataset.range;if(k)st.set({[k]:+e.target.value})});
 return st.on(s=>{
  $$(root,'[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===s.tool));
  $$(root,'[data-bg]').forEach(b=>b.classList.toggle('on',b.dataset.bg===s.bg));
  $$(root,'[data-color]').forEach(b=>b.classList.toggle('on',b.dataset.color===s.color));
  $$(root,'[data-set]').forEach(b=>{const v=b.dataset.set,i=v.indexOf(':'),k=v.slice(0,i),x=v.slice(i+1);b.classList.toggle('on',x==='toggle'?!!s[k]:String(s[k])===x)});
  $$(root,'[data-range]').forEach(r=>r.value=s[r.dataset.range]);
  $$(root,'[data-out]').forEach(o=>o.innerHTML=OUT[o.dataset.out](s));
  root.style.setProperty('--acc',BG[s.bg].acc)});
}

<div class="ip-stack" data-s="5"><div class="ip-card ip-old"><div class="fit"></div></div>
 <div class="ip-card"><div class="b-card-h"><b>Copied to clipboard</b><span data-out="size"></span></div><div class="fit"></div>
  <div class="ip-acts"><button data-act="copy">${ic('copy',14)}Copy</button><button data-act="save">${ic('download',14)}Save</button><button data-act="pinIt">${ic('pin',14)}Pin</button><button data-act="editAgain">${ic('pen',14)}Edit</button></div>
  <button class="ip-x" data-act="dismiss" aria-label="Dismiss">${ic('x',12)}</button><i class="ip-timer"></i></div>
 <span class="ip-drag">Drag the image into any app</span></div>
<div class="ip-rec" data-s="7"><span class="ip-dot"></span><b class="ip-time">00:07</b><button data-recpause title="Pause" aria-label="Pause">${ic('pause',15)}</button><button class="ip-stop" data-act="recStop" title="Stop and save" aria-label="Stop and save">${ic('stop',15)}</button><hr><button class="on" data-tg="mic" title="Microphone" aria-label="Microphone">${ic('mic',15)}</button><button data-tg="cam" title="Camera" aria-label="Camera">${ic('camera',15)}</button><button class="on" data-tg="clicks" title="Show clicks" aria-label="Show clicks">${ic('cursor',15)}</button><button class="on" data-tg="keys" title="Show keystrokes" aria-label="Show keystrokes">${ic('keyboard',15)}</button><hr><div class="seg"><button class="on" data-recfmt>MP4</button><button data-recfmt>GIF</button></div></div>
<div class="ip-sdim" data-s="8"></div>
<div class="ip-spill" data-s="8"><span>Scroll inside the selection</span><button data-act="scrollAuto">Auto-scroll</button><button data-act="scrollCancel">Cancel</button><button class="pri" data-act="scrollDone">Done</button></div>
<div class="ip-strip" data-s="8"><b>Stitched</b><span></span><div class="ip-sprev">${LONG}</div></div>
<div class="b-keys" data-s="2 3"><span><kbd>⇧</kbd>square</span><span><kbd>space</kbd>move</span><span><kbd>esc</kbd>cancel</span></div>
<div class="toast"></div>`;

const st=store({bg:'peach',pad:36,radius:10,frame:'none',crop:{x:8,y:46,w:440,h:180},anns:ARROW_DEMO('#ff3b30').map(a=>a.t==='text'?{...a,s:'Up 12% on September'}:a)});
OUT.chip=s=>{const n=exposed(s).length;return n?`<button class="ip-chip" data-act="redact">${ic('shield',14)}Blur ${n} email${n>1?'s':''}</button>`:''};
const sel=$(root,'.b-sel'),bfy=$(root,'.ip-bfy'),bar=$(root,'.b-bar'),loupe=$(root,'.b-loupe'),lz=$(root,'.b-lz'),coord=$(root,'.b-coord');
const rec=$(root,'.ip-rec'),click=$(root,'.ip-click'),keys=$(root,'.ip-keys'),pin=$(root,'.ip-pin'),pinfit=$(root,'.ip-pinfit');
const strip=$(root,'.ip-strip'),sprev=$(root,'.ip-sprev');
let step=1,dragging=false,sec=7,paused=false,frames=1,auto=null;

const placeLoupe=(x,y,p)=>{loupe.style.left=Math.min(x+16,1120-130)+'px';loupe.style.top=Math.min(y+16,720-150)+'px';
 lz.style.transform=`translate(${60-p.x*6}px,${60-p.y*6}px) scale(6)`;coord.textContent=`${Math.round(p.x*2)}, ${Math.round(p.y*2)}`};
const loupeAt=(ev,p)=>{const r=root.getBoundingClientRect(),k=r.width/1120;placeLoupe((ev.clientX-r.left)/k+8,(ev.clientY-r.top)/k+8,p)};
function layout(){
 const s=st.s,c=s.crop,sx=OX+c.x,sy=OY+c.y;
 Object.assign(sel.style,{left:sx+'px',top:sy+'px',width:c.w+'px',height:c.h+'px'});sel.classList.toggle('drawing',!!s.tool&&step===3);
 const[w,h]=canvasSize(s),fw=Math.min(w,780),fh=Math.min(h,560);
 const bl=clamp(sx+c.w/2-fw/2,20,1120-276-fw),bt=clamp(sy+c.h/2-fh/2,40,720-70-fh);
 Object.assign(bfy.style,{left:bl+'px',top:bt+'px',width:fw+'px',height:fh+'px'});
 const box=step===4?{x:bl,y:bt,w:fw,h:fh}:{x:sx,y:sy,w:c.w,h:c.h};
 let top=box.y+box.h+12;if(top>720-56)top=Math.max(box.y-54,34);
 const bw=bar.offsetWidth;bar.style.left=clamp(box.x+box.w/2-bw/2,10,(step===4?1120-276:1110)-bw)+'px';bar.style.top=top+'px';
 if(!dragging)placeLoupe(sx+c.w,sy+c.h,{x:c.x+c.w,y:c.y+c.h});
 const rw=rec.offsetWidth;rec.style.left=clamp(sx+c.w/2-rw/2,10,1110-rw)+'px';rec.style.top=(sy>90?sy-52:sy+c.h+12)+'px';
 Object.assign(click.style,{left:sx+c.w*.72+'px',top:sy+c.h*.42+'px'});Object.assign(keys.style,{left:sx+c.w/2+'px',top:sy+c.h-42+'px'});
}
st.on(layout);
st.on(s=>{const[w,h]=canvasSize(s);pinfit.style.height=Math.round(360*h/w)+'px'});

// views of the one capture: the live screen, the in-place background, the corner card, the pin
const sh=mountShot(st,{full:true});$(root,'.b-host').append(sh.shot);st.on(sh.render);
mountCanvas(bfy,st,{edit:true,m:0,max:1});
mountCanvas($(root,'.ip-stack .ip-card:not(.ip-old) .fit'),st,{m:12});
mountCanvas(pinfit,st,{m:0,max:1});
mountCanvas($(root,'.ip-old .fit'),store({bg:'aurora',pad:30}),{m:12});
[{bg:'lagoon',frame:'none',pad:20,radius:8,crop:{x:0,y:106,w:640,h:116}},{bg:'dusk',pad:30},{bg:'graphite',frame:'none',pad:16,radius:6,crop:{x:0,y:0,w:640,h:40}}]
 .forEach((s,i)=>mountCanvas($$(root,'.ip-recent .fit')[i],store(s),{m:4}));

const paintStrip=()=>{sprev.style.height=Math.min(40+frames*34,300)+'px';$(strip,'span').textContent=`${frames} frame${frames>1?'s':''}, 1280 × ${348+frames*240}`};
const fmtT=n=>`${String(n/60|0).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
setInterval(()=>{if(step===7&&!paused)$(rec,'.ip-time').textContent=fmtT(++sec)},1000);

function go(n){
 step=clamp(n,1,FLOW.length);root.className='mock vB ip s-'+step;
 $$(root,'[data-s]').forEach(el=>el.hidden=!el.dataset.s.split(' ').includes(String(step)));
 $$(document,'.steplist button').forEach((b,i)=>b.setAttribute('aria-current',i+1===step?'step':'false'));
 const f=FLOW[step-1];notes.innerHTML=`<div><p class="nt">${step}. ${f.t}</p><p>${f.p}</p></div><ul>${f.li.map(l=>`<li>${l}</li>`).join('')}</ul>`;
 $(root,'.ip-bgbtn').classList.toggle('on',step===4);
 if(step===2)st.set({tool:null});
 if(step===5)toast(root,`Copied ${OUT.size(st.s)} PNG to the clipboard`);
 if(step===8){frames=1;paintStrip()}
 try{history.replaceState(null,'','?step='+step)}catch{}
 layout();
}
const snap=(r,msg)=>{st.set({crop:FULL});go(3);toast(r,msg)};
wire(root,st,{
 menu:()=>go(1),area:()=>go(2),
 window:(s,r)=>snap(r,'Snapped to the Tally window'),full:(s,r)=>snap(r,'Full screen, 3024 × 1964'),
 scroll:()=>go(8),rec:()=>go(7),
 timer:(s,r)=>toast(r,'Capturing in 3 seconds'),
 textcap:(s,r)=>toast(r,'Drag over any text to copy it, no image saved'),
 history:(s,r)=>toast(r,'Opens every capture, searchable by the text inside'),
 settings:(s,r)=>toast(r,'Shortcuts, save location, default background'),
 bg:()=>go(step===4?3:4),done:()=>go(5),pinIt:()=>go(6),editAgain:()=>go(3),
 dismiss:(s,r)=>{go(1);toast(r,'Dismissed. It is still under Recent')},
 unpin:(s,r)=>{go(5);toast(r,'Unpinned')},
 recStop:(s,r)=>toast(r,`Saved “Recording 19.42.mp4”, ${fmtT(sec)}, ${(sec*.31).toFixed(1)} MB`),
 scrollAuto:()=>{if(auto)return;auto=setInterval(()=>{if(++frames>=8||step!==8){clearInterval(auto);auto=null}paintStrip()},450)},
 scrollCancel:(s,r)=>{frames=1;paintStrip();toast(r,'Scrolling capture cancelled')},
 scrollDone:(s,r)=>toast(r,`Saved a 1280 × ${348+frames*240} image`),
});
root.addEventListener('click',e=>{const t=e.target;
 if(t.closest('[data-pinlock]')){const on=pin.classList.toggle('locked');t.closest('button').classList.toggle('on',on);toast(root,on?'Clicks now pass through to the window below':'Pin is interactive again')}
 const tg=t.closest('[data-tg]');if(tg){tg.classList.toggle('on');if(tg.dataset.tg==='clicks')click.hidden=!tg.classList.contains('on');if(tg.dataset.tg==='keys')keys.hidden=!tg.classList.contains('on')}
 const f=t.closest('[data-recfmt]');if(f)$$(rec,'[data-recfmt]').forEach(b=>b.classList.toggle('on',b===f));
 const p=t.closest('[data-recpause]');if(p){paused=!paused;rec.classList.toggle('paused',paused);p.innerHTML=ic(paused?'play':'pause',15)}});
$(root,'[data-pinop]').addEventListener('input',e=>{pinfit.style.opacity=e.target.value/100});
pinfit.addEventListener('pointerdown',e=>{e.preventDefault();const x0=e.clientX,y0=e.clientY,l0=pin.offsetLeft,t0=pin.offsetTop,k=root.getBoundingClientRect().width/1120;
 drag(ev=>{pin.style.left=l0+(ev.clientX-x0)/k+'px';pin.style.top=t0+(ev.clientY-y0)/k+'px'})});
$(root,'.b-over').addEventListener('pointerdown',e=>{
 if(e.button||(step!==2&&step!==3)||e.target.closest('.ip-bfy'))return;e.preventDefault();
 const s=st.s,p0=sh.P(e),c0=s.crop,h=e.target.dataset.h,inside=hit({...p0,w:0,h:0},c0);
 if(step===3&&!h&&inside&&s.tool)return startDraw(e,st,sh.P,sh.inner,{prompt:true});
 const m=h||(inside?'move':'new'),cp=q=>({x:clamp(q.x,0,W),y:clamp(q.y,0,H)});
 dragging=true;loupeAt(e,cp(p0));
 drag(ev=>{const p=sh.P(ev),c=m==='new'?rectFrom(cp(p0),cp(p)):cropDrag(c0,m,p.x-p0.x,p.y-p0.y);if(c.w>=24&&c.h>=24)st.set({crop:c});loupeAt(ev,cp(p))},
  ()=>{dragging=false;if(step===2)go(3);else layout()})});

$(document,'.steplist').innerHTML=FLOW.map((f,i)=>`<li><button data-go="${i+1}"><i>${i+1}</i>${f.n}</button></li>`).join('');
$$(document,'[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
$$(document,'[data-step]').forEach(b=>b.onclick=()=>go(step+ +b.dataset.step));
const vp=$(document,'.viewport');new ResizeObserver(()=>vp.style.setProperty('--k',vp.clientWidth/1120)).observe(vp);
addEventListener('keydown',e=>{const t=e.target;if(t.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight')return go(step+(e.key==='ArrowLeft'?-1:1));
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();return undo(st)}
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='Escape')return st.set({tool:null});
 const tool=KEYS[e.key.toLowerCase()];if(tool&&(step===3||step===4)&&$(bar,`[data-tool="${tool}"]`))st.set({tool})});
go(+new URLSearchParams(location.search).get('step')||1);
</script>
</body>
</html>
